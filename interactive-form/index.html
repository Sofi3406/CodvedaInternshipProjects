<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form Validation</title>
  <link rel="stylesheet" href="../landing-page/style.css">
</head>
<body>

  <main class="container">
    <form id="registrationForm" novalidate>
      <h2>Create Account</h2>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="sofiyasin190@gmail.com">
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="09------------">
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="********">
        <small class="error"></small>
      </div>

      <button type="submit">Register</button>
      <p class="success"></p>
    </form>
  </main>

  <script src="../landing-page/script.js"></script>
</body>
</html>
